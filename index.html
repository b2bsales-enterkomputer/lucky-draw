<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterkomputer Lucky Draw</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #12121a;
      --border:   #1e1e2e;
      --blue:     #3d9fff;
      --gold:     #f5c842;
      --text:     #e8e8f0;
      --muted:    #555570;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      font-size: clamp(26px, 5vw, 40px);
      font-weight: 700;
      line-height: 1.15;
    }
    h1 span { color: var(--gold); }
    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 32px;
    }

    .card label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--blue); }
    input[type="text"]::placeholder { color: var(--muted); letter-spacing: 1px; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-validate {
      background: var(--blue);
      color: #000;
      padding: 12px 20px;
      font-size: 14px;
      white-space: nowrap;
    }

    .msg {
      margin-top: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
    }
    .msg.error   { background: #2a1010; color: #f87171; border: 1px solid #5a1a1a; display: block; }
    .msg.success { background: #0f2a1a; color: #4ade80; border: 1px solid #1a5a30; display: block; }
    .msg.info    { background: #0f1e2a; color: var(--blue); border: 1px solid #1a3a5a; display: block; }

    /* ── Wheel section ── */
    #wheel-section { display: none; flex-direction: column; align-items: center; gap: 24px; }

    .wheel-wrap {
      position: relative;
      width: 320px;
      height: 320px;
    }

    /* Pointer */
    .pointer {
      position: absolute;
      top: 50%;
      right: -20px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-right: 32px solid var(--gold);
      filter: drop-shadow(0 0 6px var(--gold));
      z-index: 10;
    }

    canvas#wheel {
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(61,159,255,0.15), 0 0 80px rgba(61,159,255,0.05);
    }

    /* Glow ring animates when spinning */
    canvas#wheel.spinning {
      box-shadow: 0 0 40px rgba(61,159,255,0.4), 0 0 80px rgba(61,159,255,0.2);
      animation: pulse-glow 0.6s ease-in-out infinite alternate;
    }
    @keyframes pulse-glow {
      from { box-shadow: 0 0 30px rgba(61,159,255,0.3), 0 0 60px rgba(61,159,255,0.1); }
      to   { box-shadow: 0 0 60px rgba(61,159,255,0.6), 0 0 100px rgba(61,159,255,0.3); }
    }

    .btn-spin {
      background: linear-gradient(135deg, var(--gold), #e0a800);
      color: #000;
      padding: 16px 48px;
      font-size: 17px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    /* ── Result modal ── */
    #result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #result-overlay.show { display: flex; }

    .result-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop-in {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .result-emoji { font-size: 56px; margin-bottom: 12px; }
    .result-label {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .result-prize {
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .result-note {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .btn-close {
      background: var(--border);
      color: var(--text);
      padding: 12px 32px;
      font-size: 15px;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

<header>
  <p class="logo-tag">Enterkomputer × Lucky Draw</p>
  <h1>Spin &amp; <span>Menang</span></h1>
  <p class="subtitle">Khusus pembelian laptop — satu nota, satu kesempatan.</p>
</header>

<!-- Step 1: Validate nota -->
<div class="card" id="validate-card">
  <label>Nomor Nota Pembelian</label>
  <div class="input-row">
    <input type="text" id="kode-input" placeholder="INV-XXXXX" maxlength="20" />
    <button class="btn-validate" id="btn-validate" onclick="validateKode()">Cek</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<!-- Step 2: Spin wheel -->
<div id="wheel-section">
  <div class="wheel-wrap">
    <canvas id="wheel" width="320" height="320"></canvas>
    <div class="pointer"></div>
  </div>
  <button class="btn-spin" id="btn-spin" onclick="spinWheel()">PUTAR SEKARANG</button>
</div>

<!-- Result modal -->
<div id="result-overlay">
  <div class="result-box">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-label">Kamu mendapatkan</div>
    <div class="result-prize" id="result-prize">—</div>
    <div class="result-note" id="result-note">Tunjukkan layar ini ke staff Enterkomputer untuk klaim hadiah.</div>
    <button class="btn-close" onclick="closeResult()">Tutup</button>
  </div>
</div>

<footer>enterkomputer.id · lucky draw v1.0</footer>

<script>
  /* ═══════════════════════════════════════════════
     KONFIGURASI — sesuaikan sebelum deploy
     ═══════════════════════════════════════════════ */

  // Supabase config — isi setelah setup Supabase
  const SUPABASE_URL = "https://lxtfyokantoenwxptccb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4dGZ5b2thbnRvZW53eHB0Y2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MDU2NDUsImV4cCI6MjA5ODI4MTY0NX0.DLfckfUa-McLS0zX6T1clA3tS5uhVW4jAsoWXQ2hzuA";

  // Segmen hadiah — weight = bobot probabilitas (total bebas, akan dinormalisasi)
  // Ganti list ini setelah dapat info dari PM
  const PRIZES = [
    { label: "Mouse Wireless",   emoji: "🖱️",  weight: 30 },
    { label: "USB Hub 4-Port",   emoji: "🔌",  weight: 25 },
    { label: "Mousepad XL",      emoji: "🎮",  weight: 20 },
    { label: "Tas Laptop",       emoji: "🎒",  weight: 15 },
    { label: "Voucher Rp50.000", emoji: "🎟️", weight: 8  },
    { label: "Voucher Rp100.000",emoji: "💰",  weight: 2  },
  ];

  // Warna segmen wheel (alternating, akan di-loop)
  const COLORS = ["#1a2a4a","#0f1f3a","#1e3a5a","#0a1628","#152f4f","#091520"];

  /* ═══════════════════════════════════════════════
     STATE
     ═══════════════════════════════════════════════ */
  let currentKode = null;   // kode nota yang sedang aktif
  let isSpinning  = false;
  let currentAngle = 0;     // posisi wheel saat ini (radian)

  /* ═══════════════════════════════════════════════
     SUPABASE HELPER
     Menggunakan REST API langsung, tanpa library —
     agar tidak perlu npm/bundler.
     ═══════════════════════════════════════════════ */

  /**
   * Cek apakah kode nota valid & belum dipakai.
   * Returns: { valid: bool, used: bool, exists: bool }
   */
  async function checkKode(kode) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/lucky_draw_codes?kode=eq.${encodeURIComponent(kode)}&select=kode,used`,
      {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        }
      }
    );
    if (!res.ok) throw new Error("Gagal menghubungi server.");
    const data = await res.json();
    if (data.length === 0) return { exists: false, used: false };
    return { exists: true, used: data[0].used };
  }

  /**
   * Tandai kode sudah dipakai & simpan hasil hadiah.
   */
  async function markKodeUsed(kode, prize) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/lucky_draw_codes?kode=eq.${encodeURIComponent(kode)}`,
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal",
        },
        body: JSON.stringify({ used: true, prize: prize, used_at: new Date().toISOString() })
      }
    );
    if (!res.ok) throw new Error("Gagal menyimpan hasil.");
  }

  /* ═══════════════════════════════════════════════
     VALIDASI KODE
     ═══════════════════════════════════════════════ */
  async function validateKode() {
    const input = document.getElementById("kode-input");
    const kode  = input.value.trim().toUpperCase();
    const msg   = document.getElementById("msg");
    const btn   = document.getElementById("btn-validate");

    // Reset state
    msg.className = "msg";
    msg.style.display = "none";

    if (!kode) {
      showMsg("Masukkan nomor nota terlebih dahulu.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Mengecek...";

    try {
      const result = await checkKode(kode);

      if (!result.exists) {
        showMsg(`Kode "${kode}" tidak ditemukan. Pastikan nomor nota sudah benar.`, "error");
      } else if (result.used) {
        showMsg(`Kode "${kode}" sudah pernah digunakan untuk spin.`, "error");
      } else {
        // Valid! Tampilkan wheel
        currentKode = kode;
        showMsg(`Kode valid ✓ Silakan putar wheel di bawah!`, "success");
        document.getElementById("validate-card").style.opacity = "0.5";
        document.getElementById("validate-card").style.pointerEvents = "none";
        document.getElementById("wheel-section").style.display = "flex";
        drawWheel(currentAngle); // render wheel awal
      }
    } catch (err) {
      showMsg(`Error: ${err.message}`, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Cek";
    }
  }

  function showMsg(text, type) {
    const msg = document.getElementById("msg");
    msg.textContent = text;
    msg.className = `msg ${type}`;
  }

  /* ═══════════════════════════════════════════════
     WHEEL DRAWING
     ═══════════════════════════════════════════════ */
  const canvas  = document.getElementById("wheel");
  const ctx     = canvas.getContext("2d");
  const CX      = canvas.width / 2;   // center X
  const CY      = canvas.height / 2;  // center Y
  const RADIUS  = CX - 6;

  // Hitung sudut tiap segmen berdasarkan weight
  function buildSegments() {
    const totalWeight = PRIZES.reduce((s, p) => s + p.weight, 0);
    let angle = 0;
    return PRIZES.map((p, i) => {
      const sweep = (p.weight / totalWeight) * 2 * Math.PI;
      const seg   = { ...p, startAngle: angle, sweep, color: COLORS[i % COLORS.length] };
      angle += sweep;
      return seg;
    });
  }
  const SEGMENTS = buildSegments();

  function drawWheel(rotationOffset) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    SEGMENTS.forEach(seg => {
      const start = seg.startAngle + rotationOffset;
      const end   = start + seg.sweep;

      // Segmen
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, RADIUS, start, end);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();
      ctx.strokeStyle = "#0a0a0f";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Label teks
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(start + seg.sweep / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#e8e8f0";
      ctx.font = "bold 13px 'Space Grotesk', sans-serif";
      ctx.fillText(seg.label, RADIUS - 14, 5);
      // Emoji
      ctx.font = "17px serif";
      ctx.fillText(seg.emoji, RADIUS - 14 - ctx.measureText(seg.label).width - 6, 5);
      ctx.restore();
    });

    // Lingkaran tengah
    ctx.beginPath();
    ctx.arc(CX, CY, 24, 0, 2 * Math.PI);
    ctx.fillStyle = "#0a0a0f";
    ctx.fill();
    ctx.strokeStyle = "#3d9fff";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Logo titik tengah
    ctx.beginPath();
    ctx.arc(CX, CY, 8, 0, 2 * Math.PI);
    ctx.fillStyle = "#3d9fff";
    ctx.fill();
  }

  /* ═══════════════════════════════════════════════
     SPIN LOGIC
     ═══════════════════════════════════════════════ */

  /**
   * Pilih hadiah secara random berdasarkan weight,
   * lalu hitung sudut akhir agar wheel berhenti tepat di hadiah tsb.
   */
  function pickPrizeAndAngle() {
    const totalWeight = PRIZES.reduce((s, p) => s + p.weight, 0);
    let r = Math.random() * totalWeight;
    let chosenIndex = 0;
    for (let i = 0; i < PRIZES.length; i++) {
      r -= PRIZES[i].weight;
      if (r <= 0) { chosenIndex = i; break; }
    }

    const seg = SEGMENTS[chosenIndex];
    // Kita ingin pointer (di kanan, sudut 0) menunjuk tengah-tengah segmen ini.
    // Pointer berada di sudut 0 (kanan). Tengah segmen di: seg.startAngle + seg.sweep/2
    // Supaya tengah segmen = 0 (mod 2π): rotationOffset = -(seg.startAngle + seg.sweep/2)
    const targetMidAngle = seg.startAngle + seg.sweep / 2;
    const targetOffset   = -targetMidAngle;

    // Tambahkan putaran penuh (5–8 putaran) agar animasi terasa dramatik
    const extraSpins = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
    const finalAngle = targetOffset + extraSpins;

    return { prize: PRIZES[chosenIndex], finalAngle };
  }

  function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;

    const btnSpin = document.getElementById("btn-spin");
    btnSpin.disabled = true;
    canvas.classList.add("spinning");

    const { prize, finalAngle } = pickPrizeAndAngle();

    const startAngle  = currentAngle;
    // Normalkan agar selalu berputar maju (searah jarum jam)
    let delta = finalAngle - (startAngle % (2 * Math.PI));
    if (delta < 0) delta += 2 * Math.PI;
    // Tambah putaran ekstra
    const totalRotation = delta + (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
    const endAngle      = startAngle + totalRotation;

    const duration = 5000; // ms
    const startTime = performance.now();

    function easeOut(t) {
      // Cubic ease-out: lambat di akhir, realistis seperti roda asli
      return 1 - Math.pow(1 - t, 3);
    }

    function animate(now) {
      const elapsed = now - startTime;
      const t       = Math.min(elapsed / duration, 1);
      const eased   = easeOut(t);

      currentAngle = startAngle + totalRotation * eased;
      drawWheel(currentAngle);

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        // Selesai
        currentAngle = endAngle;
        isSpinning   = false;
        canvas.classList.remove("spinning");

        // Simpan ke Supabase lalu tampilkan hasil
        markKodeUsed(currentKode, prize.label)
          .then(() => showResult(prize))
          .catch(err => {
            // Tetap tampilkan hasil meski save gagal — jangan blok user
            console.error("Save error:", err);
            showResult(prize);
          });
      }
    }

    requestAnimationFrame(animate);
  }

  /* ═══════════════════════════════════════════════
     RESULT MODAL
     ═══════════════════════════════════════════════ */
  function showResult(prize) {
    document.getElementById("result-emoji").textContent  = prize.emoji;
    document.getElementById("result-prize").textContent  = prize.label;
    document.getElementById("result-overlay").classList.add("show");
  }

  function closeResult() {
    document.getElementById("result-overlay").classList.remove("show");
  }

  /* ═══════════════════════════════════════════════
     ENTER key support
     ═══════════════════════════════════════════════ */
  document.getElementById("kode-input").addEventListener("keydown", e => {
    if (e.key === "Enter") validateKode();
  });

  // Render wheel awal saat halaman load (opsional, bisa dihapus)
  // drawWheel(0); // tidak di-render dulu karena wheel section hidden
</script>
</body>
</html>
