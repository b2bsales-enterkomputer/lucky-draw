<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Kode — Lucky Draw (Internal)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f7fa;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --navy:      #0e3a6b;
      --navy-dark: #0a2a4d;
      --accent:    #1f6feb;
      --text:      #1a2433;
      --muted:     #6b7785;
      --green:     #1a9d5c;
      --red:       #d64545;
      --radius:    14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 480px;
    }
    .logo-tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      background: #eaf2ff;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    h1 {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 800;
      color: var(--navy-dark);
    }
    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 30px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 24px;
      box-shadow: 0 1px 3px rgba(15,40,80,0.06);
    }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      background: #fbfcfe;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    input:focus { border-color: var(--accent); background: #fff; }
    input::placeholder { color: #b8c2cc; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 9px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      transition: opacity 0.15s, transform 0.1s, background 0.15s;
      width: 100%;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-generate {
      background: var(--navy);
      color: #fff;
      padding: 14px 20px;
      font-size: 15px;
      margin-top: 22px;
    }
    .btn-generate:not(:disabled):hover { background: var(--navy-dark); }

    .msg {
      margin-top: 14px;
      font-size: 13px;
      padding: 11px 14px;
      border-radius: 9px;
      display: none;
      line-height: 1.5;
    }
    .msg.error   { background: #fdecec; color: var(--red);   border: 1px solid #f3c6c6; display: block; }

    /* ── Result card ── */
    #result-card { display: none; }
    #result-card .card { border-color: #bfe8cf; }

    .result-success-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e9f8ef;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .result-row:last-of-type { border-bottom: none; }
    .result-row-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .result-row-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-align: right;
    }

    .kode-display {
      background: var(--navy);
      color: #fff;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      margin: 18px 0;
    }
    .kode-display .kode-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
    }
    .kode-display .kode-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .btn-copy {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 20px;
      font-size: 14px;
      margin-top: 4px;
    }
    .btn-copy:hover { background: #eef1f5; }
    .btn-copy.copied { background: #e9f8ef; color: var(--green); border-color: #bfe8cf; }

    .wa-template {
      background: #fbfcfe;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 14px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.7;
      margin-top: 14px;
      white-space: pre-wrap;
    }

    .btn-new {
      background: var(--navy);
      color: #fff;
      padding: 13px 20px;
      font-size: 14px;
      margin-top: 16px;
    }
    .btn-new:hover { background: var(--navy-dark); }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aab4bf;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <span class="logo-tag">Internal — Sales Only</span>
  <h1>Generate Kode Lucky Draw</h1>
  <p class="subtitle">Isi data customer untuk membuat kode spin. Link halaman ini hanya untuk internal sales, jangan dibagikan ke customer.</p>
</header>

<!-- Form input -->
<div id="form-card">
  <div class="card">
    <div class="field">
      <label>Nama Customer</label>
      <input type="text" id="nama-input" placeholder="Contoh: Budi Santoso" maxlength="100" />
    </div>
    <div class="field">
      <label>Nomor HP / WhatsApp</label>
      <input type="tel" id="hp-input" placeholder="Contoh: 081234567890" maxlength="20" />
    </div>
    <button class="btn-generate" id="btn-generate" onclick="generateKode()">Generate Kode</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<!-- Result -->
<div id="result-card">
  <div class="card">
    <span class="result-success-badge">✓ Kode berhasil dibuat</span>

    <div class="result-row">
      <span class="result-row-label">Nama</span>
      <span class="result-row-value" id="result-nama">—</span>
    </div>
    <div class="result-row">
      <span class="result-row-label">No. HP</span>
      <span class="result-row-value" id="result-hp">—</span>
    </div>

    <div class="kode-display">
      <div class="kode-label">Kode Undian</div>
      <div class="kode-value" id="result-kode">—</div>
    </div>

    <button class="btn-copy" id="btn-copy" onclick="copyTemplate()">Salin pesan untuk WhatsApp</button>
    <div class="wa-template" id="wa-template"></div>

    <button class="btn-new" onclick="resetForm()">+ Generate Kode Baru</button>
  </div>
</div>

<footer>Enterkomputer · Lucky Draw — Halaman Internal Sales</footer>

<script>
  /* ═══════════════════════════════════════════════
     KONFIGURASI — sama dengan halaman spin customer
     ═══════════════════════════════════════════════ */
  const SUPABASE_URL = "https://lxtfyokantoenwxptccb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4dGZ5b2thbnRvZW53eHB0Y2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MDU2NDUsImV4cCI6MjA5ODI4MTY0NX0.DLfckfUa-McLS0zX6T1clA3tS5uhVW4jAsoWXQ2hzuA";

  // Ganti dengan URL halaman spin customer kamu yang sebenarnya
  const SPIN_PAGE_URL = "https://b2bsales-enterkomputer.github.io/lucky-draw/";

  /**
   * Generate kode unik dengan format EK-XXXX (4 digit random).
   * Dicek ulang ke database untuk pastikan belum dipakai sebelumnya.
   */
  function generateRandomKode() {
    const num = Math.floor(1000 + Math.random() * 9000); // 1000-9999
    return `EK-${num}`;
  }

  /**
   * Cek apakah kode sudah ada di database (untuk hindari duplikat).
   */
  async function kodeExists(kode) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/lucky_draw_codes?kode=eq.${encodeURIComponent(kode)}&select=kode`,
      {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        }
      }
    );
    if (!res.ok) throw new Error("Gagal menghubungi server.");
    const data = await res.json();
    return data.length > 0;
  }

  /**
   * Insert kode baru ke database, lengkap dengan nama & HP customer.
   */
  async function insertKode(kode, nama, hp) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/lucky_draw_codes`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal",
        },
        body: JSON.stringify({
          kode: kode,
          customer_name: nama,
          customer_phone: hp,
          used: false,
        })
      }
    );
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Gagal menyimpan kode: ${errText}`);
    }
  }

  /**
   * Generate kode unik — retry kalau ternyata sudah ada (sangat jarang terjadi).
   */
  async function generateUniqueKode() {
    for (let i = 0; i < 5; i++) {
      const kode = generateRandomKode();
      const exists = await kodeExists(kode);
      if (!exists) return kode;
    }
    throw new Error("Gagal membuat kode unik, coba lagi.");
  }

  /* ═══════════════════════════════════════════════
     MAIN FLOW
     ═══════════════════════════════════════════════ */
  async function generateKode() {
    const namaInput = document.getElementById("nama-input");
    const hpInput   = document.getElementById("hp-input");
    const btn       = document.getElementById("btn-generate");

    const nama = namaInput.value.trim();
    const hp   = hpInput.value.trim();

    document.getElementById("msg").style.display = "none";

    if (!nama || !hp) {
      showMsg("Nama dan nomor HP wajib diisi.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Membuat kode...";

    try {
      const kode = await generateUniqueKode();
      await insertKode(kode, nama, hp);
      showResult(nama, hp, kode);
    } catch (err) {
      showMsg(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate Kode";
    }
  }

  function showMsg(text) {
    const msg = document.getElementById("msg");
    msg.textContent = text;
    msg.className = "msg error";
  }

  function showResult(nama, hp, kode) {
    document.getElementById("result-nama").textContent = nama;
    document.getElementById("result-hp").textContent   = hp;
    document.getElementById("result-kode").textContent = kode;

    const template = `Halo ${nama}! 🎉

Terima kasih sudah berbelanja laptop di Enterkomputer. Sebagai bentuk apresiasi, kamu berkesempatan memenangkan hadiah lewat Lucky Draw kami.

Kode undian kamu: ${kode}

Cara klaim:
1. Buka link: ${SPIN_PAGE_URL}
2. Masukkan kode di atas
3. Putar wheel-nya, hadiah langsung muncul!

Catatan: kode hanya bisa dipakai 1x. Tunjukkan hasil spin ke sales untuk ambil hadiahmu ya.

Terima kasih! 🙏`;

    document.getElementById("wa-template").textContent = template;

    document.getElementById("form-card").style.display = "none";
    document.getElementById("result-card").style.display = "block";

    // Reset copy button state
    const btnCopy = document.getElementById("btn-copy");
    btnCopy.textContent = "Salin pesan untuk WhatsApp";
    btnCopy.classList.remove("copied");
  }

  function copyTemplate() {
    const text = document.getElementById("wa-template").textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById("btn-copy");
      btn.textContent = "✓ Tersalin!";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Salin pesan untuk WhatsApp";
        btn.classList.remove("copied");
      }, 2000);
    });
  }

  function resetForm() {
    document.getElementById("nama-input").value = "";
    document.getElementById("hp-input").value = "";
    document.getElementById("form-card").style.display = "block";
    document.getElementById("result-card").style.display = "none";
    document.getElementById("msg").style.display = "none";
  }

  document.getElementById("hp-input").addEventListener("keydown", e => {
    if (e.key === "Enter") generateKode();
  });
</script>
</body>
</html>
